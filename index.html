    <style>
        .font-script { font-family: 'Dancing Script', cursive; }
        .font-serif-elegant { font-family: 'Playfair Display', serif; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Animasi Hati Melayang Naik ke Atas di Background */
        @keyframes floatUp {
            0% {
                transform: translateY(110vh) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.55;
            }
            85% {
                opacity: 0.55;
            }
            100% {
                transform: translateY(-15vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }
        .floating-heart-bg {
            position: absolute;
            bottom: -50px;
            animation: floatUp linear infinite;
            user-select: none;
            pointer-events: none;
        }

        /* Animasi Melayang Halus untuk Elemen Slide */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        @keyframes flameBlink {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.9); opacity: 0.85; }
        }

        /* Transisi Soft & Memejamkan Mata (Eye Blink / Soft Fade) */
        .slide-wrapper {
            transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        filter 0.35s ease;
            transform-origin: center center;
        }
        .slide-blink-out {
            opacity: 0;
            transform: scaleY(0.03) scaleX(0.96);
            filter: blur(5px);
        }
        .slide-blink-in {
            opacity: 1;
            transform: scaleY(1) scaleX(1);
            filter: blur(0px);
        }

        /* Efek Kelopak Mata Memejam Lembut di Layar */
        .eyelid-top, .eyelid-bottom {
            position: fixed;
            left: 0;
            right: 0;
            height: 50vh;
            background: linear-gradient(to bottom, rgba(253, 242, 248, 0.92), rgba(251, 207, 232, 0.96));
            backdrop-filter: blur(8px);
            z-index: 40;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.65, 0, 0.35, 1);
        }
        .eyelid-top {
            top: 0;
            transform: translateY(-100%);
            border-bottom: 2px solid rgba(244, 114, 182, 0.25);
        }
        .eyelid-bottom {
            bottom: 0;
            background: linear-gradient(to top, rgba(253, 242, 248, 0.92), rgba(251, 207, 232, 0.96));
            transform: translateY(100%);
            border-top: 2px solid rgba(244, 114, 182, 0.25);
        }
        .eyelids-closed .eyelid-top {
            transform: translateY(0%);
        }
        .eyelids-closed .eyelid-bottom {
            transform: translateY(0%);
        }

        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        .flame { animation: flameBlink 0.35s ease-in-out infinite alternate; }
        .polaroid {
            background: white;
            padding: 12px 12px 28px 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .polaroid:hover {
            transform: scale(1.02) rotate(0deg) !important;
        }
    </style>
</head>

        // ==========================================
        // 3. NAVIGASI SLIDE DENGAN TRANSISI SOFT & MEMEJAMKAN MATA
        // ==========================================
        function renderSlideContent() {
            const slides = getSlidesData();
            if (currentSlide < 0) currentSlide = 0;
            if (currentSlide >= slides.length) currentSlide = slides.length - 1;

            const container = document.getElementById('slide-container');
            if (container) {
                container.innerHTML = slides[currentSlide].render();
            }

            const numEl = document.getElementById('current-slide-num');
            if (numEl) numEl.textContent = (currentSlide + 1);

            const progressBar = document.getElementById('progress-bar');
            if (progressBar) {
                const percent = ((currentSlide + 1) / slides.length) * 100;
                progressBar.style.width = percent + '%';
            }

            const prevBtn = document.getElementById('prev-btn');
            if (prevBtn) {
                prevBtn.disabled = (currentSlide === 0);
            }

            // Atur status tombol Selanjutnya berdasarkan mini-game
            const nextBtn = document.getElementById('next-btn');
            if (nextBtn) {
                let isGameSlide = [5, 9, 10, 16, 28].includes(currentSlide);
                if (currentSlide === slides.length - 1) {
                    nextBtn.disabled = true;
                    nextBtn.textContent = "Selesai 💖";
                } else {
                    nextBtn.innerHTML = `Selanjutnya <span>→</span>`;
                    if (isGameSlide && !gameCompleted[currentSlide]) {
                        nextBtn.disabled = true;
                    } else {
                        nextBtn.disabled = false;
                    }
                }
            }
        }

        function transitionToSlide(newIndex) {
            const slides = getSlidesData();
            if (newIndex < 0 || newIndex >= slides.length) return;
            if (newIndex === currentSlide || isTransitioning) return;

            isTransitioning = true;
            const container = document.getElementById('slide-container');
            const eyelids = document.getElementById('eyelid-overlay');

            // Tahap 1: Memejamkan mata lembut & menyempitkan slide
            if (container) {
                container.classList.remove('slide-blink-in');
                container.classList.add('slide-blink-out');
            }
            if (eyelids) {
                eyelids.classList.add('eyelids-closed');
            }

            // Tahap 2: Ganti konten saat mata terpejam, lalu buka perlahan
            setTimeout(() => {
                currentSlide = newIndex;
                renderSlideContent();

                if (eyelids) {
                    eyelids.classList.remove('eyelids-closed');
                }
                if (container) {
                    container.classList.remove('slide-blink-out');
                    container.classList.add('slide-blink-in');
                }

                setTimeout(() => {
                    isTransitioning = false;
                }, 360);
            }, 340);
        }

        function nextSlide() {
            const slides = getSlidesData();
            if (currentSlide < slides.length - 1) {
                transitionToSlide(currentSlide + 1);
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                transitionToSlide(currentSlide - 1);
            }
        }

        function toggleSlideMenu() {
            const modal = document.getElementById('slide-menu-modal');
            if (!modal) return;
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                const grid = document.getElementById('slide-grid');
                if (grid) {
                    const slides = getSlidesData();
                    grid.innerHTML = slides.map((s, idx) => `
                        <button type="button" onclick="goToSlide(${idx})" class="p-2.5 rounded-xl border text-xs font-bold transition ${currentSlide === idx ? 'bg-pink-500 text-white border-pink-500 shadow' : 'bg-pink-50 hover:bg-pink-100 text-pink-700 border-pink-200'}">
                            ${idx + 1}. ${s.title}
                        </button>
                    `).join('');
                }
            }
        }

        function goToSlide(idx) {
            toggleSlideMenu();
            transitionToSlide(idx);
        }

        // --- MINI GAME 3: MENYUSUN PUZZLE FOTO (3x3) MENGGUNAKAN 7.jpg ---
        function initPuzzleGame(forceShuffle = false) {
            if (forceShuffle || (!puzzleSolved && puzzleMoves === 0 && puzzleOrder.every((v, i) => v === i))) {
                puzzleOrder = [0, 1, 2, 3, 4, 5, 6, 7, 8];
                for (let i = puzzleOrder.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [puzzleOrder[i], puzzleOrder[j]] = [puzzleOrder[j], puzzleOrder[i]];
                }
                if (puzzleOrder.every((v, i) => v === i)) {
                    [puzzleOrder[0], puzzleOrder[1]] = [puzzleOrder[1], puzzleOrder[0]];
                }
                puzzleSelectedTile = null;
                puzzleSolved = false;
                puzzleMoves = 0;
            }
        }

        function renderPhotoPuzzleSlide() {
            initPuzzleGame(false);
            const currentImg = photoMemories.puzzlePhoto; // Menggunakan 7.jpg

            return `
                <div class="flex flex-col items-center w-full">
                    <span class="bg-purple-100 text-purple-700 text-xs font-bold px-3 py-1 rounded-full mb-2">🎮 Mini Game 3: Puzzle Kenangan</span>
                    <h3 class="font-serif-elegant text-xl sm:text-2xl font-bold text-gray-800 mb-1">
                        ${puzzleSolved ? "Yeay! Puzzle Foto Tersusun! 🧩💖" : "Susun Puzzle Foto Kita!"}
                    </h3>
                    <p class="text-xs text-gray-500 mb-3">
                        ${puzzleSolved ? `Selesai dalam ${puzzleMoves} langkah! Kenangan yang indah banget ✨` : "Ketuk 2 kotak potongan foto untuk menukar posisinya hingga rapi"}
                    </p>

                    <div class="flex flex-wrap items-center justify-center gap-2 mb-3">
                        <span class="text-xs font-bold text-pink-600 bg-pink-50 px-3 py-1 rounded-full border border-pink-200">
                            Langkah: ${puzzleMoves}
                        </span>
                        <button type="button" onclick="shufflePuzzle()" class="bg-pink-100 hover:bg-pink-200 text-pink-700 text-xs font-bold px-3 py-1 rounded-full transition">
                            🔀 Acak Ulang
                        </button>
                    </div>

                    <!-- Grid Puzzle 3x3 -->
                    <div class="grid grid-cols-3 gap-1 w-56 h-56 sm:w-60 sm:h-60 bg-pink-200 p-1.5 rounded-2xl shadow-lg border-2 border-pink-300">
                        ${puzzleOrder.map((pieceIdx, posIdx) => {
                            const row = Math.floor(pieceIdx / 3);
                            const col = pieceIdx % 3;
                            const bgPosX = col * 50;
                            const bgPosY = row * 50;
                            const isSelected = puzzleSelectedTile === posIdx;

                            return `
                                <button type="button" onclick="tapPuzzleTile(${posIdx})"
                                    class="w-full h-full rounded-lg transition-all duration-200 relative overflow-hidden ${isSelected ? 'ring-4 ring-yellow-400 scale-95 z-10' : 'hover:opacity-95'}"
                                    style="background-image: url('${currentImg}'); background-size: 300% 300%; background-position: ${bgPosX}% ${bgPosY}%;">
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function tapPuzzleTile(posIdx) {
            if (puzzleSolved) return;

            if (puzzleSelectedTile === null) {
                puzzleSelectedTile = posIdx;
                renderSlideContent();
            } else if (puzzleSelectedTile === posIdx) {
                puzzleSelectedTile = null;
                renderSlideContent();
            } else {
                const temp = puzzleOrder[puzzleSelectedTile];
                puzzleOrder[puzzleSelectedTile] = puzzleOrder[posIdx];
                puzzleOrder[posIdx] = temp;
                puzzleSelectedTile = null;
                puzzleMoves++;

                if (puzzleOrder.every((val, idx) => val === idx)) {
                    puzzleSolved = true;
                    gameCompleted[10] = true;
                    triggerConfetti();
                    showToast("Hebat! Puzzle foto berhasil disusun! 🧩🎉");
                }
                renderSlideContent();
            }
        }

        function shufflePuzzle() {
            puzzleSolved = false;
            puzzleMoves = 0;
            gameCompleted[10] = false;
            initPuzzleGame(true);
            renderSlideContent();
        }

        // --- MINI GAME 4: KOTAK HADIAH MISTERI ---
        const giftRewards = [
            "🤗 Voucher Peluk & Tiyum Buat Kamu!",
            "🤗 Voucher Peluk & Tiyum Buat Kamu!",
            "🤗 Voucher Peluk & Tiyum Buat Kamu!"
        ];

        function renderGiftBoxSlide() {
            return `
                <div class="w-full max-w-md flex flex-col items-center">
                    <span class="bg-amber-100 text-amber-700 text-xs font-bold px-3 py-1 rounded-full mb-2">🎮 Mini Game 4: Kado Misteri</span>
                    <h3 class="font-serif-elegant text-xl sm:text-2xl font-bold text-gray-800 mb-1">Pilih 1 Kado Spesialmu!</h3>
                    <p class="text-xs text-gray-500 mb-5">${selectedGift !== null ? "Kado sudah dipilih dan dikunci! 💕" : "Ketuk salah satu kotak kado di bawah ini untuk membuka hadiahnya"}</p>
                    <div class="grid grid-cols-3 gap-3 w-full mb-4">
                        ${[0, 1, 2].map(i => `
                            <button type="button" ${selectedGift !== null ? 'disabled' : `onclick="openGiftBox(${i})"`} class="p-4 rounded-2xl border-2 transition flex flex-col items-center justify-center ${selectedGift === i ? 'bg-pink-100 border-pink-500 scale-105 shadow-md' : selectedGift !== null ? 'bg-gray-100 border-gray-200 opacity-60 cursor-not-allowed' : 'bg-white hover:bg-pink-50 border-pink-200 cursor-pointer'}">
                                <span class="text-4xl mb-1">${selectedGift === i ? '🎊' : selectedGift !== null ? '📦' : '🎁'}</span>
                                <span class="text-xs font-bold text-pink-600">Kado ${i + 1}</span>
                            </button>
                        `).join('')}
                    </div>
                    ${selectedGift !== null ? `
                        <div class="bg-gradient-to-r from-pink-500 to-rose-500 text-white p-4 rounded-2xl shadow-md text-sm font-bold animate-bounce">
                            ${giftRewards[selectedGift]}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function openGiftBox(idx) {
            if (selectedGift !== null) return;
            selectedGift = idx;
            gameCompleted[16] = true;
            triggerConfetti();
            showToast("Hadiah terkunci! Peluk & tiyum tersimpan! 🫂💖");
            renderSlideContent();
        }

        // --- MINI GAME 5: TIUP LILIN KUE ULANG TAHUN ---
        function renderCakeSlide() {
            return `
                <div class="flex flex-col items-center">
                    <span class="bg-pink-100 text-pink-600 text-xs font-bold px-3 py-1 rounded-full mb-2">🎮 Mini Game 5: Make a Wish</span>
                    <h3 class="font-serif-elegant text-2xl font-bold text-gray-800 mb-1">
                        ${candlesBlown ? "Yeay! Lilin Berhasil Ditiup! 🎉" : "Pejamkan Mata & Tiup Lilinnya!"}
                    </h3>
                    <p class="text-xs text-gray-500 mb-4">
                        ${candlesBlown ? "Silakan lanjut ke slide perayaan terakhir! ✨" : "Ucapkan harapanmu dalam hati, lalu tekan tombol tiup lilin di bawah"}
                    </p>

                    <!-- Ilustrasi Kue Ulang Tahun Mewah 3 Tingkat -->
                    <div class="relative flex flex-col items-center my-3">
                        <!-- Lilin & Api -->
                        <div class="flex gap-4 mb-1">
                            ${[1, 2, 3].map(() => `
                                <div class="flex flex-col items-center">
                                    ${!candlesBlown ? '<div class="w-3 h-5 bg-gradient-to-t from-orange-400 to-yellow-300 rounded-full flame mb-0.5 shadow-md"></div>' : '<div class="w-2 h-2 bg-gray-400 rounded-full mb-1"></div>'}
                                    <div class="w-2 h-8 bg-gradient-to-r from-pink-300 to-rose-300 rounded-sm shadow"></div>
                                </div>
                            `).join('')}
                        </div>
                        <!-- Toping / Krim Atas -->
                        <div class="w-32 h-4 bg-pink-300 rounded-t-full shadow-inner z-10"></div>
                        <!-- Tingkat 3 (Paling Atas) -->
                        <div class="w-36 h-10 bg-gradient-to-r from-rose-200 via-pink-200 to-rose-200 rounded-lg shadow-md border-b-2 border-pink-300 flex items-center justify-center">
                            <span class="text-[10px] font-bold text-pink-600 tracking-wider">SWEET 17</span>
                        </div>
                        <!-- Tingkat 2 (Tengah) -->
                        <div class="w-48 h-12 bg-gradient-to-r from-purple-200 via-pink-200 to-purple-200 rounded-lg shadow-md border-b-2 border-pink-300 flex items-center justify-around px-2">
                            <span class="text-xs">🍓</span>
                            <span class="text-xs">✨</span>
                            <span class="text-xs">🎂</span>
                            <span class="text-xs">✨</span>
                            <span class="text-xs">🍓</span>
                        </div>
                        <!-- Tingkat 1 (Paling Bawah) -->
                        <div class="w-60 h-14 bg-gradient-to-r from-pink-300 via-rose-300 to-pink-300 rounded-xl shadow-lg border-b-4 border-pink-400 flex items-center justify-around px-3">
                            <span class="text-sm">💖</span>
                            <span class="text-sm">🌸</span>
                            <span class="text-sm">💖</span>
                            <span class="text-sm">🌸</span>
                            <span class="text-sm">💖</span>
                        </div>
                        <!-- Piring Kue -->
                        <div class="w-68 h-3 bg-gray-200 rounded-full shadow-inner mt-1"></div>
                    </div>

                    <button type="button" onclick="blowCandles()" class="bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold px-6 py-2.5 rounded-full shadow-md hover:scale-105 transition text-sm">
                        ${candlesBlown ? "🔥 Nyalakan Lilin Lagi" : "🌬️ Tiup Lilin Sekarang!"}
                    </button>
                </div>
            `;
        }

        function blowCandles() {
            candlesBlown = !candlesBlown;
            if (candlesBlown) {
                gameCompleted[28] = true;
                triggerConfetti();
                showToast("Happy 17th Birthday Sayang! Make a wish! 🎂✨");
            } else {
                gameCompleted[28] = false;
            }
            renderSlideContent();
        }

        // ==========================================
        // 5. MUSIK OTOMATIS YOUTUBE & EFEK EMOJI HATI MELAYANG
        // ==========================================
        function startAutoMusic() {
            try {
                const player = document.getElementById('youtube-player');
                if (player) {
                    player.src = "https://www.youtube.com/embed/CgjknaWVChY?autoplay=1&loop=1&playlist=CgjknaWVChY";
                }
                showToast("🎵 Musik latar belakang diputar otomatis!");
            } catch (err) {
                console.log("Audio YouTube error", err);
            }
        }

        function triggerConfetti() {
            try {
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#ec4899', '#f43f5e', '#a855f7', '#fbbf24']
                    });
                }
            } catch (e) {}
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-box');
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2600);
        }

        function createFloatingHearts() {
            const container = document.getElementById('floating-hearts');
            if (!container) return;
            const heartEmojis = ['💖', '💕', '💗', '💓', '❤️', '💞', '💘', '💝'];
            const totalHearts = 28;

            for (let i = 0; i < totalHearts; i++) {
                const el = document.createElement('div');
                el.textContent = heartEmojis[i % heartEmojis.length];
                el.className = 'floating-heart-bg';
                el.style.left = `${Math.random() * 96}%`;
                el.style.fontSize = `${Math.floor(Math.random() * 18) + 16}px`;
                const duration = (Math.random() * 8) + 8; // 8 - 16 detik
                const delay = -(Math.random() * 15); // Langsung tersebar saat dibuka
                el.style.animationDuration = `${duration}s`;
                el.style.animationDelay = `${delay}s`;
                container.appendChild(el);
            }
        }

        // ==========================================
        // 6. LOGIKA LAYAR KUNCI PIN (261109)
        // ==========================================
        function updatePinDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((dot, idx) => {
                if (idx < enteredPin.length) {
                    dot.classList.remove('bg-transparent');
                    dot.classList.add('bg-pink-500', 'scale-110');
                } else {
                    dot.classList.remove('bg-pink-500', 'scale-110');
                    dot.classList.add('bg-transparent');
                }
            });
        }

        function enterPinDigit(digit) {
            if (isUnlocked || enteredPin.length >= 6) return;
            const errEl = document.getElementById('pin-error-msg');
            if (errEl) errEl.textContent = "";

            enteredPin += String(digit);
            updatePinDots();

            if (enteredPin.length === 6) {
                setTimeout(checkPin, 150);
            }
        }

        function deletePinDigit() {
            if (isUnlocked || enteredPin.length === 0) return;
            enteredPin = enteredPin.slice(0, -1);
            updatePinDots();
        }

        function clearPin() {
            if (isUnlocked) return;
            enteredPin = "";
            const errEl = document.getElementById('pin-error-msg');
            if (errEl) errEl.textContent = "";
            updatePinDots();
        }

        function checkPin() {
            if (enteredPin === SECRET_PIN) {
                isUnlocked = true;
                const lockScreen = document.getElementById('pin-lock-screen');
                if (lockScreen) {
                    lockScreen.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => {
                        lockScreen.style.display = 'none';
                    }, 500);
                }
                currentSlide = 0;
                renderSlideContent();
                startAutoMusic();
                triggerConfetti();
                showToast("PIN Benar! Selamat Ulang Tahun ke-17 Sayang! 💖🎂");
            } else {
                const errEl = document.getElementById('pin-error-msg');
                const cardEl = document.getElementById('pin-card');
                if (errEl) errEl.textContent = "PIN salah! Coba ingat tanggal spesial kita 💕";
                if (cardEl) {
                    cardEl.classList.remove('animate-shake');
                    void cardEl.offsetWidth;
                    cardEl.classList.add('animate-shake');
                }
                setTimeout(() => {
                    enteredPin = "";
                    updatePinDots();
                }, 400);
            }
        }

        // Dukungan Ketik Keyboard untuk PIN & Navigasi Slide
        document.addEventListener('keydown', (e) => {
            if (!isUnlocked) {
                if (e.key >= '0' && e.key <= '9') {
                    enterPinDigit(e.key);
                } else if (e.key === 'Backspace') {
                    deletePinDigit();
                } else if (e.key === 'Escape') {
                    clearPin();
                }
            } else {
                if (e.key === 'ArrowRight') nextSlide();
                if (e.key === 'ArrowLeft') prevSlide();
            }
        });

        // Inisialisasi Awal Saat Halaman Dimuat
        window.addEventListener('DOMContentLoaded', () => {
            createFloatingHearts();
        });
    </script>
</body>
</html>
